<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CardBook — loading V3.1.7</title></head>
<body style="font-family:system-ui,sans-serif;background:#f5f7fb;color:#162033;display:grid;place-items:center;min-height:100vh;margin:0">
<p id="status">Loading CardBook V3.1.7…</p>
<script>
(async()=>{
  const expected='6958e7ebcd98a4a59530507ca63f4aa1d8ebd4b5fbd65a17cc30e3d4fdc5e150';
  try{
    const responses=await Promise.all(Array.from({length:13},(_,i)=>'assets/cardbook-v317-'+String(i+1).padStart(2,'0')+'.txt').map(p=>fetch(p,{cache:'no-cache'})));
    responses.forEach(r=>{if(!r.ok)throw new Error('Application download failed')});
    const parts=await Promise.all(responses.map(r=>r.text()));
    const encoded=parts.join('').replace(/\s/g,'');
    const binary=atob(encoded),bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    if(typeof DecompressionStream==='undefined')throw new Error('Please open CardBook in an updated browser');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const raw=await new Response(stream).arrayBuffer();
    const digest=await crypto.subtle.digest('SHA-256',raw);
    const actual=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');
    if(actual!==expected)throw new Error('Application integrity check failed');
    const html=new TextDecoder().decode(raw);
    const frame=document.createElement('iframe');
    frame.title='CardBook V3.1.7';
    frame.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;background:#f5f7fb';
    frame.setAttribute('allow','clipboard-read; clipboard-write');
    frame.src=URL.createObjectURL(new Blob([raw],{type:'text/html'}));
    document.body.innerHTML='';document.body.style.display='block';document.body.appendChild(frame);
  }catch(error){
    document.getElementById('status').textContent='CardBook could not load: '+error.message;
  }
})();
</script></body></html>
